<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>HoloNews · Aparências 2.3</title>
  </head>
  <body>
    <div class="demo-toolbar">
      <div>
        <strong>HoloNews <span>APARÊNCIAS 2.3</span></strong
        ><small>Prévia navegável · dados de demonstração</small>
      </div>
      <nav aria-label="Prévia">
        <button data-mode="portal" class="is-active">Portal</button
        ><button data-mode="manager" hidden>Criador do mestre</button
        ><label
          >Leitor<select id="demo-reader">
            <option value="player">Jogador</option>
            <option value="gm">Mestre</option>
            <option value="iris">Íris</option>
          </select></label
        ><label class="demo-motion-preference"
          ><input id="demo-reduce-motion" type="checkbox" />Reduzir
          movimento</label
        ><button data-reset hidden title="Restaurar dados de demonstração">
          Reiniciar
        </button>
      </nav>
    </div>
    <main class="demo-stage">
      <section class="hsn-window">
        <div id="demo" class="window-content"></div>
      </section>
    </main>
    <div id="demo-toast" role="status" aria-live="polite"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
