name: Publish Foundry release

on:
  push:
    branches: [main]
    paths: [module.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holonews-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read version
        id: version
        run: echo "value=$(node -p 'JSON.parse(require("fs").readFileSync("module.json", "utf8")).version')" >> "$GITHUB_OUTPUT"
      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.exists == 'false'
        run: npm ci
      - if: steps.release.outputs.exists == 'false'
        run: npx playwright install --with-deps chromium
      - name: Validate, test and package
        if: steps.release.outputs.exists == 'false'
        run: npm run release
      - name: Publish tag and release assets
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cp preview-dist/HoloNews-Preview.html artifacts/HoloNews-Prisma-Preview.html
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "HoloNews v$VERSION — Prisma" \
            --notes-file docs/release-notes.md \
            --latest \
            module.json \
            "artifacts/holosuite-news-v$VERSION.zip" \
            "artifacts/holosuite-news-v$VERSION-source.zip" \
            "artifacts/holosuite-news-v$VERSION.zip.sha256" \
            "artifacts/holosuite-news-v$VERSION-source.zip.sha256" \
            artifacts/HoloNews-Prisma-Preview.html
